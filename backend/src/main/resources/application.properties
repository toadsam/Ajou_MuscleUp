server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
app.upload-dir=${UPLOAD_DIR:uploads}
app.s3.enabled=${S3_ENABLED:false}
app.s3.bucket=${S3_BUCKET:}
app.s3.region=${AWS_REGION:ap-northeast-2}
app.s3.prefix=${S3_PREFIX:uploads}
app.s3.public-base-url=${S3_PUBLIC_BASE_URL:}
# Behind a reverse proxy (nginx/ALB): trust X-Forwarded-* so request.getRemoteAddr() is the real client IP
server.forward-headers-strategy=framework
# Flyway data migrations run by DataMigrationRunner after Hibernate ddl-auto
app.data-migrations.enabled=${DATA_MIGRATIONS_ENABLED:true}
# Kakao login (REST, authorization code). Empty = disabled (POST /api/auth/kakao -> 503)
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
# comma-separated redirect URIs registered in Kakao console, e.g. https://musclehub.co.kr/auth/kakao/callback
kakao.redirect-uris=${KAKAO_REDIRECT_URIS:}
